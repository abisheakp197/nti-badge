[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nti-benchmark"
version = "0.1.1"
description = "Verifiable security benchmark for AI agent frameworks"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Abisheak P", email = "abisheakp197@gmail.com"}
]
keywords = ["ai", "security", "benchmark", "post-quantum", "nti", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "nti-attack-library>=0.1.0",
    "ube-foundation>=0.1.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/abisheakp197/nti-benchmark"
Repository = "https://github.com/abisheakp197/nti-benchmark"
Issues = "https://github.com/abisheakp197/nti-benchmark/issues"

[project.scripts]
nti-benchmark = "cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-random-order>=1.1.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["benchmarks*", "runner*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
