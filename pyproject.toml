[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nti-badge"
version = "0.1.1"
description = "Cryptographically signed, offline-verifiable compliance badge for AI agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "ube-foundation>=0.1.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nti_badge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.vercel]
entrypoint = "api/index.py:handler"
